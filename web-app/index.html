    <style>
      /* Critical CSS for 0ms visual load */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #020204;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .initial-loader {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #020204;
        z-index: 99999;
        transition: opacity 0.3s ease-out;
      }
      .initial-loader-spinner {
        width: 40px;
        height: 40px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" id="initial-loader">
        <div class="initial-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loader once React mounts
      window.addEventListener('load', function() {
        var root = document.getElementById('root');
        var observer = new MutationObserver(function(mutations) {
          if (root.children.length > 1 || (root.children[0] && root.children[0].id !== 'initial-loader')) {
            var loader = document.getElementById('initial-loader');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(function() { loader.remove(); }, 300);
            }
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      });
    </script>
  </body>
