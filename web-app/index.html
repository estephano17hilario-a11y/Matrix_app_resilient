    <style>
      /* Critical CSS for 0ms visual load */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #020204;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .initial-loader {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #020204;
        z-index: 99999;
        transition: opacity 0.3s ease-out;
      }
      /* Same mark as the in-app boot sequence, so there is no jump from a
         spinner to the logo while the bundle loads. */
      .initial-loader-mark {
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 100;
        font-size: clamp(2.5rem, 8vw, 4rem);
        letter-spacing: 0.45em;
        margin-right: -0.45em;
        color: rgba(255, 255, 255, 0.94);
        text-shadow: 0 0 32px rgba(129, 140, 248, 0.35);
        line-height: 1;
        /* centred, exactly where the boot screen keeps it */
        animation: initial-loader-in 0.6s ease both;
      }
      @keyframes initial-loader-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <noscript>Lux necesita JavaScript para funcionar. Lux es un sistema de productividad con notas en árbol, tareas inteligentes, enfoque Pomodoro y seguimiento de hábitos.</noscript>
    <div id="root">
      <div class="initial-loader" id="initial-loader">
        <div class="initial-loader-mark">LUX</div>
      </div>
    </div>
    <script>window.__luxBootMark = Date.now();</script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loader once React mounts
      window.addEventListener('load', function() {
        var root = document.getElementById('root');
        var observer = new MutationObserver(function(mutations) {
          if (root.children.length > 1 || (root.children[0] && root.children[0].id !== 'initial-loader')) {
            var loader = document.getElementById('initial-loader');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(function() { loader.remove(); }, 300);
            }
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      });
    </script>
  </body>
